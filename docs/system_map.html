<head>

  <title>GC Toxic Shield — System Map &amp; Architecture</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #060911;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }
    /* Toolbar Header */
    header {
      height: 58px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 50;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 12px #38bdf8;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #f1f5f9;
    }
    .badge-bar {
      display: flex;
      gap: 8px;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
    }
    .badge.cyan { color: #38bdf8; border-color: rgba(56, 189, 248, 0.4); }
    .badge.green { color: #34d399; border-color: rgba(52, 211, 153, 0.4); }
    .badge.red { color: #f87171; border-color: rgba(248, 113, 113, 0.4); }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      background: #334155;
      color: #ffffff;
      border-color: #64748b;
    }
    .btn:active {
      transform: scale(0.97);
    }

    /* Viewport Area */
    #viewport {
      flex: 1;
      position: relative;
      cursor: grab;
      overflow: hidden;
      background: radial-gradient(circle at center, #0d1527 0%, #060911 100%);
    }
    #viewport:active {
      cursor: grabbing;
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
      transition: transform 0.05s linear;
    }
    svg {
      display: block;
      width: 1600px;
      height: 1100px;
    }

    /* Floating Quick Help */
    .hint {
      position: absolute;
      bottom: 16px;
      right: 20px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 11.5px;
      color: #94a3b8;
      pointer-events: none;
    }
  </style>
</head>

  <div class="hint">🖱️ Drag mouse untuk geser • Scroll wheel untuk Zoom</div>

  <script>
    const viewport = document.getElementById('viewport');
    const canvas = document.getElementById('canvas');

    let scale = 1;
    let posX = 0;
    let posY = 0;
    let isDragging = false;
    let startX = 0;
    let startY = 0;

    function updateTransform() {
      canvas.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
    }

    function fitView() {
      const vWidth = viewport.clientWidth;
      const vHeight = viewport.clientHeight;
      const svgWidth = 1600;
      const svgHeight = 1100;

      const scaleX = vWidth / (svgWidth + 60);
      const scaleY = vHeight / (svgHeight + 60);
      scale = Math.min(scaleX, scaleY, 1.2);

      posX = (vWidth - svgWidth * scale) / 2;
      posY = (vHeight - svgHeight * scale) / 2;
      updateTransform();
    }

    function resetView() {
      scale = 1;
      const vWidth = viewport.clientWidth;
      const vHeight = viewport.clientHeight;
      posX = (vWidth - 1600) / 2;
      posY = (vHeight - 1100) / 2;
      updateTransform();
    }

    function zoom(delta) {
      const newScale = Math.min(Math.max(0.3, scale + delta), 3.0);
      const factor = newScale / scale;
      
      const vWidth = viewport.clientWidth / 2;
      const vHeight = viewport.clientHeight / 2;
      
      posX = vWidth - (vWidth - posX) * factor;
      posY = vHeight - (vHeight - posY) * factor;
      scale = newScale;
      updateTransform();
    }

    // Pan / Drag handlers
    viewport.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      isDragging = true;
      startX = e.clientX - posX;
      startY = e.clientY - posY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      posX = e.clientX - startX;
      posY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    // Zoom on wheel
    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 0.1 : -0.1;
      zoom(zoomFactor);
    }, { passive: false });

    // Initial setup
    window.addEventListener('resize', fitView);
    window.addEventListener('DOMContentLoaded', fitView);
    fitView();
  </script>
